<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Done — A Quiet To-Do</title>
<style>
  :root {
    --bg-0: #0b0d12;
    --bg-1: #10131b;
    --bg-2: #161a25;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text-1: #eef1f7;
    --text-2: #9aa3b5;
    --text-3: #5c6577;
    --accent: #7c6cf0;
    --accent-soft: rgba(124, 108, 240, 0.16);
    --gold: #e8c57a;
    --green: #4ade80;
    --radius: 14px;
    --font-display: Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124, 108, 240, 0.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(232, 197, 122, 0.05), transparent 60%),
      var(--bg-0);
    color: var(--text-1);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    padding: 6vh 20px 8vh;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); }

  /* ---------- Layout ---------- */
  .app {
    width: 100%;
    max-width: 560px;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Header ---------- */
  header { margin-bottom: 34px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(38px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--gold); }

  .date-line {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-2);
  }

  /* ---------- Input ---------- */
  .composer {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }

  .input-wrap {
    position: relative;
    flex: 1;
  }

  #task-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 18px 15px 46px;
    color: var(--text-1);
    font-size: 15px;
    font-family: var(--font-body);
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  #task-input::placeholder { color: var(--text-3); }
  #task-input:focus {
    border-color: var(--accent);
    background: var(--bg-2);
    box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 30px -12px rgba(124, 108, 240, 0.45);
  }

  .input-wrap::before {
    content: "";
    position: absolute;
    left: 18px;
    top: 50%;
    width: 12px;
    height: 12px;
    border: 1.5px solid var(--text-3);
    border-radius: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    transition: border-color 0.25s;
  }
  .input-wrap:focus-within::before { border-color: var(--accent); }

  #add-btn {
    flex-shrink: 0;
    border: none;
    border-radius: var(--radius);
    padding: 0 22px;
    background: linear-gradient(160deg, #8f7ff5, #6a58d8);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-body);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
    box-shadow: 0 6px 20px -8px rgba(124, 108, 240, 0.6);
  }
  #add-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  #add-btn:active { transform: translateY(1px) scale(0.97); }
  #add-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- Filter tabs ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .tab {
    position: relative;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font-body);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s;
  }
  .tab:hover { color: var(--text-1); }
  .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tab[aria-selected="true"] { color: var(--text-1); }

  .tab-pill {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.25s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: -1;
  }
  .tab[aria-selected="true"] .tab-pill { opacity: 1; transform: scale(1); }

  .count {
    font-size: 13px;
    color: var(--text-3);
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }
  .count strong { color: var(--text-2); font-weight: 600; }

  /* ---------- Task list ---------- */
  ul#list { list-style: none; }

  .task {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    animation: slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
    user-select: none;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .task:hover { background: var(--surface-hover); border-color: var(--border-strong); transform: translateX(3px); }
  .task:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .task.leaving { animation: slide-out 0.28s ease-in both; }
  @keyframes slide-out {
    to { opacity: 0; transform: translateX(24px) scale(0.96); height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  }

  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--text-3);
    border-radius: 7px;
    display: grid;
    place-items: center;
    transition: border-color 0.25s, background 0.3s, box-shadow 0.3s;
  }
  .task:hover .checkbox { border-color: var(--accent); }

  .checkbox svg {
    width: 12px;
    height: 12px;
    stroke: var(--bg-0);
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
  }

  .task.done .checkbox {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 0 14px -2px rgba(74, 222, 128, 0.5);
  }
  .task.done .checkbox svg {
    animation: draw-check 0.35s cubic-bezier(0.65, 0, 0.45, 1) 0.05s forwards;
  }
  @keyframes draw-check { to { stroke-dashoffset: 0; } }

  .task-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.45;
    position: relative;
    transition: color 0.3s;
    word-break: break-word;
  }
  /* animated strike-through */
  .task-text::after {
    content: "";
    position: absolute;
    left: 0;
    top: 52%;
    height: 1.5px;
    width: 0;
    background: var(--text-3);
    transition: width 0.35s cubic-bezier(0.65, 0, 0.45, 1);
  }
  .task.done .task-text { color: var(--text-3); }
  .task.done .task-text::after { width: 100%; }

  .delete-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: none;
    background: transparent;
    border-radius: 8px;
    color: var(--text-3);
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s, color 0.2s, background 0.2s;
  }
  .task:hover .delete-btn, .delete-btn:focus-visible { opacity: 1; transform: scale(1); }
  .delete-btn:hover { color: #f87171; background: rgba(248, 113, 113, 0.12); }
  .delete-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  @media (hover: none) { .delete-btn { opacity: 1; transform: scale(1); } }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 56px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-3);
    animation: rise 0.5s ease both;
  }
  .empty .mark {
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--text-2);
    display: block;
    margin-bottom: 10px;
  }
  .empty p { font-size: 14px; }

  [hidden] { display: none !important; }

  /* ---------- Celebration ---------- */
  #celebration {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 50;
  }
  .celebration-card {
    text-align: center;
    animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes pop-in {
    0%   { opacity: 0; transform: scale(0.6) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .celebration-card.hide { animation: pop-out 0.4s ease both; }
  @keyframes pop-out {
    to { opacity: 0; transform: scale(0.85) translateY(-10px); }
  }

  .burst-ring {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9b8df7, #6a58d8);
    display: grid;
    place-items: center;
    box-shadow:
      0 0 0 10px rgba(124, 108, 240, 0.12),
      0 0 0 22px rgba(124, 108, 240, 0.05),
      0 20px 50px -12px rgba(124, 108, 240, 0.55);
    animation: ring-pulse 2s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { box-shadow: 0 0 0 10px rgba(124,108,240,0.12), 0 0 0 22px rgba(124,108,240,0.05), 0 20px 50px -12px rgba(124,108,240,0.55); }
    50%      { box-shadow: 0 0 0 14px rgba(124,108,240,0.16), 0 0 0 30px rgba(124,108,240,0.06), 0 20px 60px -10px rgba(124,108,240,0.7); }
  }

  .burst-ring svg { width: 44px; height: 44px; }
  .burst-ring svg path {
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw-check 0.5s cubic-bezier(0.65, 0, 0.45, 1) 0.25s forwards;
  }

  .celebration-card h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(30px, 6vw, 40px);
    letter-spacing: -0.01em;
  }
  .celebration-card p {
    margin-top: 6px;
    color: var(--text-2);
    font-size: 15px;
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 49;
  }

  @media (max-width: 480px) {
    body { padding: 5vh 14px 6vh; }
    .composer { flex-direction: row; }
    #add-btn { padding: 0 16px; }
    .toolbar { justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<main class="app">
  <header>
    <div class="eyebrow">Today</div>
    <h1>What needs <em>doing</em>?</h1>
    <p class="date-line" id="date-line"></p>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <div class="input-wrap">
      <input type="text" id="task-input" placeholder="Add a task…" aria-label="New task" maxlength="200" />
    </div>
    <button type="submit" id="add-btn">Add</button>
  </form>

  <div class="toolbar" role="tablist" aria-label="Filter tasks">
    <div class="tabs">
      <button class="tab" role="tab" data-filter="all" aria-selected="true"><span class="tab-pill"></span>All</button>
      <button class="tab" role="tab" data-filter="active" aria-selected="false"><span class="tab-pill"></span>Active</button>
      <button class="tab" role="tab" data-filter="done" aria-selected="false"><span class="tab-pill"></span>Done</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <ul id="list" aria-label="Tasks"></ul>

  <div class="empty" id="empty">
    <span class="mark">✳</span>
    <p>Nothing here yet. Add your first task above.</p>
  </div>
</main>

<div id="celebration" hidden>
  <div class="celebration-card" id="celebration-card">
    <div class="burst-ring">
      <svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" /></svg>
    </div>
    <h2>All done!</h2>
    <p>Nice work — every task is complete.</p>
  </div>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
(function () {
  "use strict";

  var tasks = [];
  var nextId = 1;
  var filter = "all";
  var celebrating = false;

  var listEl   = document.getElementById("list");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");
  var inputEl  = document.getElementById("task-input");
  var formEl   = document.getElementById("composer");
  var celebrationEl = document.getElementById("celebration");
  var cardEl = document.getElementById("celebration-card");
  var canvas = document.getElementById("confetti-canvas");
  var ctx = canvas.getContext("2d");

  /* ---- date line ---- */
  var now = new Date();
  document.getElementById("date-line").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  /* ---- helpers ---- */
  function openCount() {
    var n = 0;
    for (var i = 0; i < tasks.length; i++) if (!tasks[i].done) n++;
    return n;
  }

  function visibleTasks() {
    return tasks.filter(function (t) {
      if (filter === "active") return !t.done;
      if (filter === "done")   return t.done;
      return true;
    });
  }

  /* ---- render ---- */
  function render() {
    listEl.innerHTML = "";
    var visible = visibleTasks();

    visible.forEach(function (t, idx) {
      var li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "");
      li.setAttribute("tabindex", "0");
      li.setAttribute("role", "checkbox");
      li.setAttribute("aria-checked", t.done ? "true" : "false");
      li.style.animationDelay = (idx * 0.03) + "s";

      var box = document.createElement("span");
      box.className = "checkbox";
      box.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>';

      var text = document.createElement("span");
      text.className = "task-text";
      text.textContent = t.text;

      var del = document.createElement("button");
      del.className = "delete-btn";
      del.setAttribute("aria-label", "Delete task: " + t.text);
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h10M5.5 4V2.8A.8.8 0 0 1 6.3 2h1.4a.8.8 0 0 1 .8.8V4M3.2 4l.5 7.6a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9l.5-7.6"/></svg>';

      function toggle() {
        t.done = !t.done;
        li.classList.toggle("done", t.done);
        li.setAttribute("aria-checked", t.done ? "true" : "false");
        updateCount();
        applyFilterSoft();
        updateCelebration();
      }

      li.addEventListener("click", function (e) {
        if (e.target.closest(".delete-btn")) return;
        toggle();
      });
      li.addEventListener("keydown", function (e) {
        if (e.target.closest(".delete-btn")) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });

      del.addEventListener("click", function () {
        li.classList.add("leaving");
        var id = t.id;
        setTimeout(function () {
          tasks = tasks.filter(function (x) { return x.id !== id; });
          render();
          updateCelebration();
        }, 270);
      });

      li.appendChild(box);
      li.appendChild(text);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    emptyEl.hidden = visible.length > 0;
    updateCount();
  }

  /* Soft re-filter: hide/show without full re-render so animations persist */
  function applyFilterSoft() {
    var anyVisible = false;
    Array.prototype.forEach.call(listEl.children, function (li) {
      var done = li.classList.contains("done");
      var show = filter === "all" || (filter === "active" && !done) || (filter === "done" && done);
      li.style.display = show ? "" : "none";
      if (show) anyVisible = true;
    });
    emptyEl.hidden = anyVisible;
  }

  function updateCount() {
    var n = openCount();
    countEl.innerHTML = tasks.length === 0
      ? "No tasks"
      : "<strong>" + n + "</strong> open · " + tasks.length + " total";
  }

  /* ---- add ---- */
  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = inputEl.value.trim();
    if (!text) return;
    tasks.push({ id: nextId++, text: text, done: false });
    inputEl.value = "";
    render();
    updateCelebration();
    inputEl.focus();
  });

  /* ---- tabs ---- */
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
    tab.addEventListener("click", function () {
      filter = tab.getAttribute("data-filter");
      document.querySelectorAll(".tab").forEach(function (t) {
        t.setAttribute("aria-selected", t === tab ? "true" : "false");
      });
      render();
    });
  });

  /* ---- celebration ---- */
  function updateCelebration() {
    var shouldCelebrate = tasks.length > 0 && openCount() === 0;
    if (shouldCelebrate && !celebrating) {
      celebrating = true;
      celebrationEl.hidden = false;
      cardEl.classList.remove("hide");
      launchConfetti();
    } else if (!shouldCelebrate && celebrating) {
      celebrating = false;
      cardEl.classList.add("hide");
      setTimeout(function () { celebrationEl.hidden = true; }, 380);
    }
  }

  /* ---- confetti ---- */
  var pieces = [];
  var confettiRunning = false;
  var COLORS = ["#7c6cf0", "#e8c57a", "#4ade80", "#f0a6c0", "#8ecae6", "#ffffff"];

  function resizeCanvas() {
    canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function launchConfetti() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2 - 40;
    for (var i = 0; i < 90; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 8;
      pieces.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1,
        decay: 0.006 + Math.random() * 0.008,
        circle: Math.random() < 0.3
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(tick);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    pieces = pieces.filter(function (p) { return p.life > 0 && p.y < window.innerHeight + 40; });
    pieces.forEach(function (p) {
      p.vy += 0.16;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.circle) {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.sin(p.rot * 2)) + 1);
      }
      ctx.restore();
    });
    if (pieces.length > 0) {
      requestAnimationFrame(tick);
    } else {
      confettiRunning = false;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  render();
})();
</script>
</body>
</html>
