<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiet — a small to-do</title>
<style>
  :root {
    --bg: #0b0b10;
    --bg-2: #12121a;
    --surface: #17171f;
    --surface-2: #1e1e28;
    --border: #26262f;
    --border-strong: #33333f;
    --text: #ecebe6;
    --text-dim: #a8a7a1;
    --text-mute: #6b6a66;
    --accent: #e8b86d;
    --accent-soft: #e8b86d22;
    --success: #8fbf7a;
    --danger: #d67a7a;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 10px 20px -10px rgba(0,0,0,.4);
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1a26 0%, transparent 60%),
      radial-gradient(800px 500px at 80% 110%, #161620 0%, transparent 60%),
      var(--bg);
    padding: 48px 20px 80px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app {
    width: 100%;
    max-width: 540px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  header {
    padding: 32px 28px 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  header::after {
    content: "";
    position: absolute;
    left: 28px; right: 28px; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  h1 .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: 2px;
    box-shadow: 0 0 12px var(--accent);
  }

  .tagline {
    margin-top: 6px;
    color: var(--text-mute);
    font-size: 13px;
    letter-spacing: 0.01em;
  }

  .input-row {
    padding: 20px 28px 8px;
    display: flex;
    gap: 10px;
  }

  .input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  .input::placeholder { color: var(--text-mute); }

  .input:hover { border-color: var(--border-strong); }
  .input:focus {
    border-color: var(--accent);
    box-shadow: var(--focus);
    background: #15151d;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    padding: 0 18px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .1s ease, background .2s ease, border-color .2s ease, color .2s ease;
    letter-spacing: 0.01em;
  }

  .btn:hover { background: var(--surface-2); border-color: #44444f; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: var(--focus); }

  .btn-primary {
    background: var(--accent);
    color: #1a1408;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { background: #f0c37a; border-color: #f0c37a; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px 6px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: 999px;
  }

  .tab {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color .2s ease, background .2s ease;
    letter-spacing: 0.01em;
  }

  .tab:hover { color: var(--text); }
  .tab:focus-visible { outline: none; box-shadow: var(--focus); }
  .tab[aria-selected="true"] {
    background: var(--surface-2);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }

  .counter {
    font-size: 13px;
    color: var(--text-mute);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .counter strong {
    color: var(--text);
    font-weight: 600;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 10px 16px 16px;
    min-height: 120px;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    margin: 4px 0;
    border-radius: var(--radius-sm);
    transition: background .15s ease, opacity .25s ease, transform .25s ease;
    animation: slideIn .35s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task:hover { background: #1a1a24; }

  .task.removing {
    animation: slideOut .28s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(20px); max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; }
  }

  .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
    padding: 0;
  }

  .check:hover { border-color: var(--accent); transform: scale(1.06); }
  .check:focus-visible { outline: none; box-shadow: var(--focus); }

  .check svg {
    width: 14px;
    height: 14px;
    stroke: var(--bg);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1) .05s;
  }

  .task.done .check {
    background: var(--success);
    border-color: var(--success);
    animation: pop .4s cubic-bezier(.2,1.4,.3,1);
  }

  .task.done .check svg { stroke-dashoffset: 0; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
    cursor: pointer;
    padding: 2px 0;
    word-break: break-word;
    transition: color .25s ease;
    user-select: none;
  }

  .task.done .task-text {
    color: var(--text-mute);
    text-decoration: line-through;
    text-decoration-color: var(--text-mute);
    text-decoration-thickness: 1px;
  }

  .delete {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--text-mute);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity .2s ease, color .2s ease, background .2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .task:hover .delete,
  .delete:focus-visible { opacity: 1; }

  .delete:hover { color: var(--danger); background: #2a1a1a; }
  .delete:focus-visible { outline: none; box-shadow: var(--focus); opacity: 1; }

  .delete svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-mute);
    font-size: 14px;
    letter-spacing: 0.01em;
  }

  .empty .icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px dashed var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-mute);
  }

  .empty .icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; }

  .empty strong { color: var(--text-dim); display: block; margin-bottom: 4px; font-weight: 500; }

  /* Celebration */
  .celebrate {
    position: relative;
    padding: 22px 20px;
    margin: 8px 16px 4px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #1c1a14 0%, #1a1a14 100%);
    border: 1px solid #3a3320;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
    animation: celebrateIn .55s cubic-bezier(.2,.9,.2,1.2) both;
  }

  @keyframes celebrateIn {
    0% { opacity: 0; transform: translateY(8px) scale(.96); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.02); }
    100% { transform: translateY(0) scale(1); }
  }

  .celebrate.out { animation: celebrateOut .3s ease forwards; }
  @keyframes celebrateOut {
    to { opacity: 0; transform: translateY(-6px) scale(.98); }
  }

  .celebrate .badge {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f2c87a, #c9923f);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px #2a2314, 0 0 24px #e8b86d55;
    flex-shrink: 0;
    animation: badgePulse 2s ease-in-out infinite;
  }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 4px #2a2314, 0 0 20px #e8b86d44; }
    50% { box-shadow: 0 0 0 4px #2a2314, 0 0 32px #e8b86d77; }
  }

  .celebrate .badge svg {
    width: 18px; height: 18px;
    stroke: #1a1408;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .celebrate .msg { flex: 1; }
  .celebrate .msg .title {
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .celebrate .msg .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .confetti span {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 2px;
    top: 50%; left: 20%;
    opacity: 0;
    animation: burst 1.2s cubic-bezier(.2,.7,.3,1) forwards;
  }

  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(.4); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); }
  }

  footer {
    padding: 14px 28px 22px;
    color: var(--text-mute);
    font-size: 12px;
    text-align: center;
    border-top: 1px solid var(--border);
    letter-spacing: 0.02em;
  }

  /* Mobile */
  @media (max-width: 480px) {
    body { padding: 20px 12px 60px; }
    header { padding: 24px 20px 18px; }
    header::after { left: 20px; right: 20px; }
    .input-row { padding: 16px 20px 6px; }
    .toolbar { padding: 14px 20px 4px; }
    .list { padding: 8px 10px 14px; }
    .celebrate { margin: 8px 10px 4px; }
    .delete { opacity: 1; }
    h1 { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <main class="app" aria-label="To-do list">
    <header>
      <div class="brand">
        <h1><span class="dot" aria-hidden="true"></span>Quiet</h1>
      </div>
      <p class="tagline">A small place for the things you mean to do.</p>
    </header>

    <form class="input-row" id="addForm" autocomplete="off">
      <input
        class="input"
        id="taskInput"
        type="text"
        placeholder="What needs doing?"
        aria-label="New task"
        maxlength="200"
        required
      />
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Filter tasks">
        <button class="tab" role="tab" data-filter="all" aria-selected="true">All</button>
        <button class="tab" role="tab" data-filter="active" aria-selected="false">Active</button>
        <button class="tab" role="tab" data-filter="done" aria-selected="false">Done</button>
      </div>
      <div class="counter" id="counter" aria-live="polite">
        <strong id="openCount">0</strong> open
      </div>
    </div>

    <div id="celebrateWrap"></div>

    <ul class="list" id="list" aria-live="polite"></ul>

    <footer>Press <kbd>Enter</kbd> to add · click a task to complete it</footer>
  </main>

<script>
(function () {
  const state = {
    tasks: [],
    filter: 'all',
    nextId: 1,
    celebrating: false
  };

  const $ = (sel) => document.querySelector(sel);
  const list = $('#list');
  const form = $('#addForm');
  const input = $('#taskInput');
  const openCount = $('#openCount');
  const celebrateWrap = $('#celebrateWrap');
  const tabs = document.querySelectorAll('.tab');

  function addTask(text) {
    const t = text.trim();
    if (!t) return;
    state.tasks.push({ id: state.nextId++, text: t, done: false });
    if (state.celebrating) dismissCelebration();
    render();
  }

  function toggleTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    if (!task.done && state.celebrating) dismissCelebration();
    render();
    maybeCelebrate();
  }

  function deleteTask(id) {
    const el = list.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      setTimeout(() => {
        state.tasks = state.tasks.filter(t => t.id !== id);
        render();
      }, 260);
    } else {
      state.tasks = state.tasks.filter(t => t.id !== id);
      render();
    }
  }

  function filtered() {
    if (state.filter === 'active') return state.tasks.filter(t => !t.done);
    if (state.filter === 'done') return state.tasks.filter(t => t.done);
    return state.tasks;
  }

  function render() {
    // Counter
    const open = state.tasks.filter(t => !t.done).length;
    openCount.textContent = open;

    // List
    const items = filtered();
    list.innerHTML = '';

    if (state.tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </div>
        <strong>Your list is quiet.</strong>
        Add a task above to begin.
      `;
      list.appendChild(empty);
    } else if (items.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      const msg = state.filter === 'active'
        ? { t: 'Nothing active.', s: 'Everything on your list is done.' }
        : { t: 'Nothing done yet.', s: 'Complete a task to see it here.' };
      empty.innerHTML = `
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <strong>${msg.t}</strong>
        ${msg.s}
      `;
      list.appendChild(empty);
    } else {
      items.forEach(task => list.appendChild(renderTask(task)));
    }
  }

  function renderTask(task) {
    const li = document.createElement('li');
    li.className = 'task' + (task.done ? ' done' : '');
    li.dataset.id = task.id;

    const check = document.createElement('button');
    check.className = 'check';
    check.type = 'button';
    check.setAttribute('aria-label', task.done ? 'Mark as not done' : 'Mark as done');
    check.innerHTML = '<svg viewBox="0 0 20 20"><polyline points="4 10 8 14 16 6"/></svg>';
    check.addEventListener('click', () => toggleTask(task.id));

    const text = document.createElement('span');
    text.className = 'task-text';
    text.textContent = task.text;
    text.addEventListener('click', () => toggleTask(task.id));

    const del = document.createElement('button');
    del.className = 'delete';
    del.type = 'button';
    del.setAttribute('aria-label', 'Delete task');
    del.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 6h12M7 6V4h6v2M6 6v10a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"/></svg>';
    del.addEventListener('click', () => deleteTask(task.id));

    li.appendChild(check);
    li.appendChild(text);
    li.appendChild(del);
    return li;
  }

  function maybeCelebrate() {
    if (state.tasks.length === 0) return;
    const allDone = state.tasks.every(t => t.done);
    if (allDone && !state.celebrating) showCelebration();
    else if (!allDone && state.celebrating) dismissCelebration();
  }

  function showCelebration() {
    state.celebrating = true;
    celebrateWrap.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'celebrate';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');

    // Confetti
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    const colors = ['#e8b86d', '#8fbf7a', '#d67a7a', '#ecebe6', '#a8a7a1'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      const angle = (Math.PI * 2 * i) / 22 + Math.random() * 0.4;
      const dist = 70 + Math.random() * 80;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.15) + 's';
      s.style.width = (4 + Math.random() * 4) + 'px';
      s.style.height = (4 + Math.random() * 4) + 'px';
      confetti.appendChild(s);
    }

    el.innerHTML = `
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 20 20"><polyline points="4 10 8 14 16 6"/></svg>
      </div>
      <div class="msg">
        <div class="title">All done.</div>
        <div class="sub">Nice work — the list is clear.</div>
      </div>
    `;
    el.appendChild(confetti);
    celebrateWrap.appendChild(el);
  }

  function dismissCelebration() {
    const el = celebrateWrap.querySelector('.celebrate');
    if (!el) { state.celebrating = false; return; }
    el.classList.add('out');
    setTimeout(() => {
      celebrateWrap.innerHTML = '';
      state.celebrating = false;
    }, 280);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    addTask(input.value);
    input.value = '';
    input.focus();
  });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected', 'false'));
      tab.setAttribute('aria-selected', 'true');
      state.filter = tab.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
